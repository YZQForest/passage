name: Build and verify Passage
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: "--mac dmg --arm64"
          - os: macos-15-intel
            target: "--mac dmg --x64"
          - os: windows-latest
            target: "--win nsis --x64"
          - os: ubuntu-latest
            target: "--linux AppImage --x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: UI smoke (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke.mjs && node scripts/ai-smoke.mjs && node scripts/key-smoke.mjs
      - name: UI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Package development artifacts
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: passage-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.blockmap
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run android:sync
      - run: cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: passage-android-development
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
